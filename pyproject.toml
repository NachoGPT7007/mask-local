[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-local"
version = "0.1.0"
description = "法院实习材料的本地脱敏工具：Word / Excel / PDF 文书与证据"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "local" }]

# 运行期依赖与 .venv 中已装版本一致；不在本机联网环境重装也没关系，
# 这些只是让 `pip install -e .` 能复现环境。
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "cryptography>=42",
    "rapidocr-onnxruntime>=1.3",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mask-local = "masking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masking = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
