# 脱敏策略配置
#
# policy 取值：
#   code_word  用 lexicon.yaml 的词池生成带框代号，如 张三 → 【熊猫】
#   mask       整体掩码 XXX（同类多个时 XXX1 / XXX2 区分）
#   case_no    案号专用格式化：保留年份与案件类型，法院代字自编
#   keep       识别但不替换（写入报告供你判断）
#   warn       不替换且强制进入「需人工复核」清单

version: 1

policy:
  person: code_word
  org: code_word
  place: code_word
  address: code_word
  id_card: mask
  phone: mask
  bank_card: mask
  uscc: mask
  plate: mask
  email: mask
  case_no: case_no
  # 金额与日期是法律分析必需，脱掉后工作台分析不出东西，默认保留
  date: keep
  amount: keep
  custom: mask

case_no:
  keep_year: true        # 保留年份段 (2024)
  keep_case_type: true   # 保留案件类型 民初 / 刑初 / 执 / 民终
  court_code: 甲法        # 法院代字统一替换为该值
  renumber: true         # 序号在本次运行内自 1 递增，不复用原数字（原数字常含立案序号线索）

detect:
  min_name_len: 2
  max_name_len: 4

  # 姓名上下文线索：这些词后 0-6 字内出现的 2-4 字中文串，判定为姓名
  name_cues:
    - 原告
    - 被告
    - 第三人
    - 上诉人
    - 被上诉人
    - 再审申请人
    - 申请人
    - 被申请人
    - 申请执行人
    - 被执行人
    - 法定代表人
    - 主要负责人
    - 负责人
    - 委托诉讼代理人
    - 委托代理人
    - 指定辩护人
    - 辩护人
    - 审判长
    - 审判员
    - 人民陪审员
    - 审理法官
    - 承办法官
    - 执行法官
    - 法官
    - 审判人员
    - 合议庭成员
    - 书记员
    - 法官助理
    - 鉴定人
    - 翻译人员
    - 法警
    - 证人
    - 被害人
    - 犯罪嫌疑人
    - 被告人
    - 当事人
    - 联系人
    - 经办人
    - 代理人
    - 签名
    - 签章
    - 盖章

  # 姓名前的隔离词：命中这些词时不把后文当姓名，避免「原告认为」「被告辩称」误判
  name_blockers:
    - 认为
    - 辩称
    - 诉称
    - 称
    - 主张
    - 提交
    - 提供
    - 请求
    - 申请
    - 表示
    - 陈述
    - 承认
    - 否认
    - 与
    - 及
    - 和
    - 等

  # 「区」后缀的地名匹配约束。
  #
  # 中文里「XX区」绝大多数不是行政区划：校区、小区、园区、社区、景区、辖区……
  # 不加约束时，真实案例里出现过「用户反复纠结校区」被脱成「用户反复【建木】区」、
  # 「直接推荐区位更好」被脱成「直接【汤谷】区位更好」——这类误脱比漏脱更糟，
  # 因为它把正常语义改写成了假地名，下游分析会直接读错。
  #
  # 规则：候选地名以「区」结尾时，「区」前面紧邻的字若在 blocker_before 里，
  # 或「区」后面紧邻的字在 blocker_after 里，一律不算地名。
  place_zone_blocker_before: 校小园社景辖地城郊矿厂库灾疫学院营警片街站港牧垦特县市省区
  place_zone_blocker_after: 位域别分间内外块段划属级县长委

# 残留审计：脱敏完成后用这些规则二次扫描输出文件，
# 命中即说明有漏网，写入「需人工复核」清单
#
# 注意：这里不能用 \b。Python 的 \b 是 \w/\W 边界，而汉字属于 \w，
# 所以「码3301」之间没有词边界，「\b\d{17}」在中文紧邻数字时永远不匹配。
# 一律改用显式的 ASCII 前后瞻。
residual_patterns:
  身份证号:
    - '(?<![0-9A-Za-z])\d{17}[\dXx](?![0-9A-Za-z])'
    - '(?<![0-9A-Za-z])\d{15}(?![0-9A-Za-z])'
  手机号:
    - '(?<![0-9A-Za-z])1[3-9]\d{9}(?![0-9A-Za-z])'
  统一社会信用代码:
    - '(?<![0-9A-Za-z])[0-9A-HJ-NPQRTUWXY]{18}(?![0-9A-Za-z])'
  未脱敏机构:
    # (?<!】) 必须加：脱敏后机构写作「【白桦】公司」，不排除会从
    # 「【昆仑】市分公司」里匹配出「市分公司」，造成假 critical。
    # 后缀清单覆盖到「学院/医院/委员会」这类：跨行断词时它们最容易漏，
    # 而旧规则只认「有限公司/律所」，漏了也不会报警。
    - '(?<!】)[\u4e00-\u9fa5A-Za-z0-9]{2,12}(?:律师事务所有限公司|股份有限公司|有限责任公司|集团有限公司|专利代理事务所|会计师事务所|税务师事务所|资产评估事务所|职业技术学院|职业学院|职业大学|技师学院|技术学院|高级中学|初级中学|妇幼保健院|人民医院|有限公司|股份公司|分公司|总公司|律师事务所|事务所|研究院|研究所|设计院|幼儿园|合作社|基金会|委员会|卫生院|中医院|大学|学院|中学|小学|学校|银行|支行|分行|信用社|协会|商会|工厂|公司|医院|厂|店)'
  未脱敏法院:
    # 负向断言挡的是「通用表述前缀」（请求 / 各级 / 最高 / 高级 / 致函），
    # 不能用单字（上/下/本/该/向…）——那会误伤上海、下关、本溪这类真实地名。
    # 也不能用 (?<!请求) 这种定长环视：它检查匹配起点之前，
    # 而「请求人民法院」的匹配起点是「请」，环视永远看到「求」前面的字。
    - '(?!(?:请求|各级|最高|高级|致函))[\u4e00-\u9fa5]{2,6}(?:人民法院|人民检察院|互联网法院|知识产权法院|金融法院|海事法院|铁路运输法院|军事法院|林区法院|农垦法院)'
  未脱敏案号:
    # (?!甲法) 是为了不把本工具自编的案号误判成残留；
    # 若 rules.yaml 的 case_no.court_code 改了，这里要同步改
    - '[\(（\[〔]\s*\d{4}\s*[\)）\]〕]\s*(?!甲法)[\u4e00-\u9fa5]{1,3}\d{0,4}[\u4e00-\u9fa5]{1,3}\d+\s*号'
  邮箱:
    - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  银行卡:
    # 必须带卡组织前缀（62 银联 / 4 Visa / 51-55 MasterCard / 34-37 运通），
    # 否则「TSA-05-20240514846242929」这类时间戳证书编号会被误判成卡号。
    - '(?<![0-9A-Za-z])(?:62[0-9]{14,17}|4[0-9]{15,18}|5[1-5][0-9]{14,17}|3[47][0-9]{13,15})(?![0-9A-Za-z])'

# 输出目录结构
output:
  masked_dir: output          # 脱敏件
  vault_dir: vault            # 映射表 + 审计报告（仅本人可读）
  keep_tree: true             # 保留输入目录结构，便于对照
