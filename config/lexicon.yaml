# 代号词库
#
# 设计约束：
#   1. 所有代号一律用 frame 包裹，交付给法律工作台时能一眼看出「这是脱敏痕迹」。
#   2. 词池按首次出现顺序取用，同一案件内不复用、不重复，避免主体混淆。
#   3. 词必须与法律文书常见用词无冲突：不得是法条名词、程序术语、常见姓氏组合。
#   4. 池子用尽时程序报错并要求扩充，绝不循环复用（复用会导致两个不同主体撞号）。

version: 1

